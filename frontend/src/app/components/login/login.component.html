<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script>
<mat-card class="login-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title class="login-title">Welcome Back</mat-card-title>
    <mat-card-subtitle>Please login to your account</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form #loginForm="ngForm" (ngSubmit)="login()" novalidate>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="user.name" name="name" type="text" [required]="!user.email" #name="ngModel" placeholder="Enter your username">
        <mat-error *ngIf="name.invalid && name.touched">Name or Email is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="user.email" name="email" type="email" [required]="!user.name" #email="ngModel" placeholder="Enter your email">
        <mat-error *ngIf="email.invalid && email.touched">Email or Name is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [(ngModel)]="user.password" name="password" type="password" required placeholder="Enter your password">
      </mat-form-field>
      <div class="button-group">
        <button mat-raised-button color="primary" [disabled]="loginForm.invalid" type="submit">Login</button>
        <button mat-stroked-button color="accent" type="button" (click)="register()">Register</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<style>
  .login-card {
    max-width: 400px;
    margin: 40px auto;
    padding: 20px;
  }
  .login-title {
    font-weight: 600;
    font-size: 24px;
  }
  .full-width {
    width: 100%;
    margin-bottom: 16px;
  }
  .button-group {
    display: flex;
    justify-content: space-between;
  }
</style>
