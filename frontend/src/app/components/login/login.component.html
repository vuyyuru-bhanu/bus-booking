<mat-card class="login-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title class="login-title">Welcome Back</mat-card-title>
    <mat-card-subtitle>Please login to your account</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="login()" novalidate>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username or Email</mat-label>
        <input matInput [(ngModel)]="user.name" name="name" type="text" required placeholder="Enter your username or email" />
        <mat-error *ngIf="loginForm.submitted && !user.name">Username or Email is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="user.email" name="email" type="email" required placeholder="Enter your email" style="color: black;" />
        <mat-error *ngIf="loginForm.submitted && !user.email">Email is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [(ngModel)]="user.password" name="password" type="password" required placeholder="Enter your password" style="color: black;" />
        <mat-error *ngIf="loginForm.submitted && !user.password">Password is required</mat-error>
      </mat-form-field>
      <div class="button-group">
        <button mat-raised-button color="primary" [disabled]="loginForm.invalid" type="submit">Login</button>
        <button mat-stroked-button color="accent" type="button" (click)="register()">Register</button>
      </div>
      </form>
  </mat-card-content>
</mat-card>

<style>
  .login-card {
    max-width: 400px;
    margin: 40px auto;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    border-radius: 8px;
  }
  .login-title {
    font-weight: 700;
    font-size: 28px;
    color: #d32f2f;
  }
  .full-width {
    width: 100%;
    margin-bottom: 16px;
  }
  .button-group {
    display: flex;
    justify-content: space-between;
  }
</style>
