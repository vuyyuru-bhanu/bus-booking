<div class="admin-dashboard-container">
  <h2>Admin Dashboard - User Management</h2>

  <div class="messages">
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
  </div>

  <form (ngSubmit)="addUser()" #addUserForm="ngForm" class="add-user-form">
    <h3>Add New User</h3>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" [(ngModel)]="newUser.email" required email />
    </div>
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" name="name" [(ngModel)]="newUser.name" required />
    </div>
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" name="role" [(ngModel)]="newUser.role" required>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" [(ngModel)]="newUser.password" required minlength="8" />
    </div>
    <button type="submit" [disabled]="!addUserForm.form.valid">Add User</button>
  </form>

  <h3>Existing Users</h3>
  <table class="users-table">
    <thead>
      <tr>
        <th>Email</th>
        <th>Name</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td *ngIf="editUserId !== user.id">{{ user.email }}</td>
        <td *ngIf="editUserId === user.id">
          <input [(ngModel)]="editUserData.email" />
        </td>

        <td *ngIf="editUserId !== user.id">{{ user.name }}</td>
        <td *ngIf="editUserId === user.id">
          <input [(ngModel)]="editUserData.name" />
        </td>

        <td *ngIf="editUserId !== user.id">{{ user.role }}</td>
        <td *ngIf="editUserId === user.id">
          <select [(ngModel)]="editUserData.role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </td>

        <td>
          <button *ngIf="editUserId !== user.id" (click)="editUser(user)">Edit</button>
          <button *ngIf="editUserId === user.id" (click)="updateUser()">Save</button>
          <button *ngIf="editUserId === user.id" (click)="cancelEdit()">Cancel</button>
          <button (click)="deleteUser(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
