<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><mat-card class="admin-card">
  <mat-card-title>Manage Buses</mat-card-title>
  <mat-card-content>
    <form>
      <mat-form-field appearance="fill">
        <mat-label>Route ID</mat-label>
        <input matInput [(ngModel)]="bus.routeId" name="routeId" type="number" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Company</mat-label>
        <input matInput [(ngModel)]="bus.company" name="company" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>AC</mat-label>
        <mat-select [(ngModel)]="bus.ac" name="ac" required>
          <mat-option [value]="true">Yes</mat-option>
          <mat-option [value]="false">No</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Type</mat-label>
        <mat-select [(ngModel)]="bus.type" name="type" required>
          <mat-option value="seater">Seater</mat-option>
          <mat-option value="sleeper">Sleeper</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Capacity</mat-label>
        <input matInput [(ngModel)]="bus.capacity" name="capacity" type="number" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Available Seats</mat-label>
        <input matInput [(ngModel)]="bus.availableSeats" name="availableSeats" type="number" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Price</mat-label>
        <input matInput [(ngModel)]="bus.price" name="price" type="number" step="0.01" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Amenities (comma-separated)</mat-label>
        <input matInput [(ngModel)]="bus.amenities" name="amenities">
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="createBus()">Add Bus</button>
    </form>
  </mat-card-content>
</mat-card>
<style>
  .admin-card { max-width: 800px; margin: 20px auto; }
</style>
