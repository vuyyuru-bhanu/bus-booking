services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_USER=bus_user
      - DB_PASSWORD=secure_password
      - DB_NAME=bus_booking
      - JWT_SECRET=your_jwt_secret_key
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # frontend service removed; frontend is now built and served by nginx

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=bus_booking
      - MYSQL_USER=bus_user
      - MYSQL_PASSWORD=secure_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"

volumes:
  mysql-data:
  uploads: